<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0A1628"/>

  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffffff" stroke-width="0.3" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="6" height="630" fill="#2DD4BF"/>

  <!-- Teal glow circle (top right) -->
  <circle cx="1100" cy="100" r="300" fill="#2DD4BF" opacity="0.04"/>

  <!-- Logo mark -->
  <rect x="80" y="80" width="56" height="56" rx="12" fill="#2DD4BF"/>
  <text x="108" y="118" font-family="Georgia, serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle">E</text>

  <!-- Main headline -->
  <text x="80" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="64" font-weight="900" fill="white" letter-spacing="-1">Energy Storage</text>
  <text x="80" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="64" font-weight="900" fill="white" letter-spacing="-1">Disease</text>

  <!-- Subhead -->
  <text x="80" y="370" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" fill="#94A3B8" font-weight="400">Diabetes is misnamed. This is the root-cause diagnosis.</text>

  <!-- Divider -->
  <line x1="80" y1="410" x2="500" y2="410" stroke="#2DD4BF" stroke-width="2" opacity="0.4"/>

  <!-- Stats row -->
  <text x="80" y="460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" fill="#2DD4BF" font-weight="700">537M</text>
  <text x="80" y="488" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#64748B">People affected</text>

  <text x="240" y="460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" fill="#2DD4BF" font-weight="700">90%</text>
  <text x="240" y="488" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#64748B">Preventable</text>

  <text x="380" y="460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" fill="#2DD4BF" font-weight="700">4 Pillars</text>
  <text x="380" y="488" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#64748B">ESD framework</text>

  <!-- HOMA-IR badge (right side) -->
  <rect x="780" y="200" width="360" height="200" rx="20" fill="#0F2040" stroke="#2DD4BF" stroke-width="1.5" stroke-opacity="0.3"/>
  <text x="960" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#2DD4BF" font-weight="600" text-anchor="middle" letter-spacing="2">HOMA-IR CALCULATOR</text>
  <text x="960" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="48" font-weight="900" fill="white" text-anchor="middle">Free Tool</text>
  <text x="960" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#64748B" text-anchor="middle">Measure your insulin resistance</text>

  <!-- URL -->
  <text x="80" y="580" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#475569">energystoragedisease.com</text>
</svg>
