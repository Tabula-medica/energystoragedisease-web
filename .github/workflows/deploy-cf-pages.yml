name: deploy-cf-pages

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "vite.config.ts"
      - "tailwind.config.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-cf-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cf-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vite SPA
        run: npm run build
        env:
          NODE_ENV: production

      - name: Deploy to Cloudflare Pages
        run: npx wrangler@3 pages deploy dist --project-name=energystoragedisease
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "6f0f81ab6245bad1f761e47799179ffe"
